<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesona Wisata Sumatera Utara</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pesona Wisata Sumatera Utara</h1>
        <p>Jelajahi keindahan alam, budaya, dan kuliner khas Tanah Batak & Melayu</p>
    </header>

    <section class="filter-section">
        <input type="text" id="searchInput" placeholder="Cari destinasi (contoh: Danau Toba, Berastagi)...">
        <div class="filter-buttons">
            <button class="btn active" onclick="filterWisata('semua')">Semua</button>
            <button class="btn" onclick="filterWisata('alam')">Wisata Alam</button>
            <button class="btn" onclick="filterWisata('budaya')">Budaya & Sejarah</button>
            <button class="btn" onclick="filterWisata('edukasi')">Edukasi & Keluarga</button>
        </div>
    </section>

    <main id="wisataContainer" class="wisata-grid">
        <!-- Daftar kartu wisata akan dimunculkan otomatis oleh JavaScript -->
    </main>

    <!-- Modal Detail Wisata -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="tutupModal()">&times;</span>
            <img id="modalImg" src="" alt="Foto Wisata">
            <h2 id="modalTitle"></h2>
            <p class="lokasi" id="modalLokasi"></p>
            <p class="harga" id="modalHarga"></p>
            <p id="modalDesc"></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Eksplorasi Sumatera Utara | Dibuat dengan HTML, CSS & JS</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
